---
- name: Show msg with hostvars
  hosts: all
  become: yes

  tasks:
  - name : Update information
    template:
      src: magic-variables.j2
      dest: /tmp/information.txt
      owner: root
      group: root
      mode: '0666'
  - name: display 
    shell: 
      cmd: cat /tmp/information.txt
    register: msg
  - debug:
      var: msg
...

