---
- name: Add additional lines to files/blockinfile.txt
  hosts: localhost

  tasks:
  - blockinfile:
     path: files/blockinfile.txt
     block: |
       First line in additional block of text
       Second line ...
       Update on {{ ansible_date_time.iso8601 }}
     state: present
     marker: "#{mark} By J"
     marker_begin: "#<<-- Start of added lines -->>"
     marker_end: "#<<-- End of added lines -->>"
     insertbefore: "fox"
...
